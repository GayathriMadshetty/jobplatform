{% extends "jobs/base.html" %}{% block content %}<h2>Recommended for you</h2>
{% for r in recs %}<div class="card"><div class="row"><a href="{% url 'job_detail' r.job.pk %}"><b>{{ r.job.title }}</b></a><span class="muted">{{ r.job.company }}</span><span class="score" style="margin-left:auto">{{ r.score }}%</span></div>
{% for s in r.matched %}<span class="badge good">{{ s }}</span>{% endfor %}{% for s in r.missing %}<span class="badge bad">{{ s }}</span>{% endfor %}</div>{% endfor %}{% endblock %}
